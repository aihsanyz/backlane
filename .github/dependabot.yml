version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: development
    groups:
      dev-bagimliliklari:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: development

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    target-branch: development
