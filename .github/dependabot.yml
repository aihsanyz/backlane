version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: development
    groups:
      dev-bagimliliklari:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: development

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    target-branch: development
    # Node 24 LTS'te kalıyoruz. Dependabot major atlama önermesin; 26 henüz
    # LTS değil ve LTS dışına çıkmak istemiyorum. LTS'e geçtiğinde bu bloğu
    # kaldırmak yeterli.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
