name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Runner'in kullanicisi 1000 degil; imaji ona gore kurmazsak bind-mount
      # edilen .cache dizinlerine yazamiyor.
      - name: Runner kimligini belirle
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      # Yerelde hangi imaj calisiyorsa CI'da da ayni imaj calissin.
      # Etiket, compose'un bekledigi ad ile ayni olmali (proje: backlane).
      - name: Dev imajini kur
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          tags: backlane-dev:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            UID=${{ env.HOST_UID }}
            GID=${{ env.HOST_GID }}

      - name: Cache dizinlerini hazirla
        run: mkdir -p .cache/pnpm-store .cache/node_modules .turbo

      - uses: actions/cache@v6
        with:
          path: .cache/pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Bagimliliklari kur
        run: docker compose -f compose.yaml -f compose.ci.yaml run --rm -T dev pnpm install --frozen-lockfile

      - name: Lint
        run: docker compose -f compose.yaml -f compose.ci.yaml run --rm -T dev pnpm exec biome ci .

      - name: Typecheck + test + build
        run: docker compose -f compose.yaml -f compose.ci.yaml run --rm -T dev pnpm exec turbo run typecheck test build
