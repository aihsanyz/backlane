packages:
  - packages/*

# Store, node_modules'tan ayrı bir docker volume'ünde duruyor; volume'ler ayrı
# dosya sistemi olduğu için hardlink sınır aşamıyor. Kopyalama biraz disk yiyor
# ama davranış öngörülebilir kalıyor.
storeDir: /pnpm/store
packageImportMethod: copy

# Ortak sürümler tek yerde. Paketler "catalog:" yazarak buraya bağlanıyor,
# böylece paketler arasında sürüm kayması olmuyor.
catalog:
  "@biomejs/biome": ^2.5.11
  "@vitest/coverage-v8": ^4.1.11
  tsdown: ^0.22.14
  turbo: ^2.10.12
  typescript: ^7.0.2
  vitest: ^4.1.11
